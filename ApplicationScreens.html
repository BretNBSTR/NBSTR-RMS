<section id="applications" class="page hidden">
<header><div><h1>Applications</h1><p>One visible workflow from receipt through foster matching.</p></div><button class="primary" onclick="showPage('newApplication')">+ New Application</button></header>
<div class="card"><div id="applicationList" class="list loading">Loading…</div></div>
</section>

<section id="newApplication" class="page hidden">
<header><div><h1>New Application</h1><p>Development intake screen. Form integration comes next.</p></div></header>
<form id="applicationForm" class="card form-card" onsubmit="saveApplication(event)">
<div class="form-grid">
<label>First Name*<input name="firstName" required></label><label>Last Name*<input name="lastName" required></label>
<label>Email*<input name="email" type="email" required></label><label>Phone<input name="phone"></label>
<label>Address<input name="address1"></label><label>City<input name="city"></label>
<label>State<input name="state" maxlength="2"></label><label>ZIP<input name="zip"></label>
</div><div class="actions"><button type="button" class="secondary" onclick="showPage('applications')">Cancel</button><button class="primary" id="appSaveBtn">Receive Application</button></div>
</form>
</section>

<section id="applicationDetail" class="page hidden">
<header><div><button class="linkbtn" onclick="showPage('applications')">← Applications</button><h1 id="appName">Application</h1><p id="appMeta"></p></div></header>
<div class="detail-grid">
<div>
<div class="card"><h2>Applicant</h2><div id="appFacts"></div></div>
<div class="card topgap"><h2>Workflow Actions</h2><div id="appActions"></div></div>
</div>
<div>
<div class="card"><h2>Active Work</h2><div id="appTasks"></div></div>
<div class="card topgap"><h2>Application History</h2><div id="appHistory"></div></div>
</div>
</div>
</section>
