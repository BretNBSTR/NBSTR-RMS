<section id="notificationSettings" class="page hidden">
<header><div><h1>My Notifications</h1><p>Choose immediate urgent notices and a routine daily work digest.</p></div></header>
<div class="card form-card">
 <label class="check"><input id="notifyUrgent" type="checkbox"> Email me immediately for urgent/high-priority work</label>
 <label class="check"><input id="notifyDigest" type="checkbox"> Send me one daily My Work digest</label>
 <div class="circle-note">Routine tasks are grouped into the digest instead of generating an email for every workflow step.</div>
 <div class="actions"><button class="primary" onclick="saveNotificationSettings()">Save Notification Settings</button></div>
</div>
</section>
